groups:
  - name: stablecoin-gateway-business
    rules:
      - alert: StablecoinGatewayKMSSignerDown
        expr: up{job="stablecoin-gateway-kms-signer"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: KMS 签名服务监控端点不可用
          description: Prometheus 已连续 2 分钟无法抓取 KMS signer，请检查进程和网络。

      - alert: StablecoinGatewaySignerFailures
        expr: sum by (job, instance) (increase(stablecoin_gateway_signer_requests_total{result=~"failed|timeout"}[5m])) >= 3
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 签名请求重复失败或超时
          description: 最近 5 分钟至少 3 次签名请求失败或超时，请核对 KMS 权限、节点和数据库。

      - alert: StablecoinGatewaySignerUnauthorizedRequests
        expr: sum by (job, instance) (increase(stablecoin_gateway_signer_requests_total{result="unauthorized"}[5m])) >= 10
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 签名端点反复出现未授权请求
          description: 最近 5 分钟至少 10 次请求未通过 signer 鉴权，请检查令牌配置和调用来源。

      - alert: StablecoinGatewayMonitorDown
        expr: up{job="stablecoin-gateway-monitor"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: stablecoin-gateway 业务监控进程不可用
          description: Prometheus 已连续 2 分钟无法抓取 gateway-monitor。

      - alert: StablecoinGatewayMonitorSamplingFailures
        expr: stablecoin_gateway_worker_consecutive_failures{worker="business-monitor"} >= 3
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 业务风险指标连续采样失败
          description: gateway-monitor 已连续至少 3 次无法读取一致性数据库快照。

      - alert: StablecoinGatewayCriticalReconciliationCases
        expr: stablecoin_gateway_business_reconciliation_open_cases{severity="critical"} > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 存在未关闭的严重对账差异
          description: 当前有 {{ $value }} 个 critical 对账工单需要人工处置。

      - alert: StablecoinGatewayOutboxDeadLetters
        expr: stablecoin_gateway_business_outbox_events{status="dead"} > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Outbox 存在死信
          description: 当前有 {{ $value }} 个 Outbox 死信事件需要人工处置。

      - alert: StablecoinGatewayPayoutAwaitingBroadcastTooLong
        expr: stablecoin_gateway_business_payouts{status="ready_for_broadcast"} > 0 and (time() - stablecoin_gateway_business_payout_oldest_created_timestamp_seconds{status="ready_for_broadcast"}) > 300
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 已签名出款等待广播时间过长
          description: 最早一笔 ready_for_broadcast 出款创建已超过 5 分钟，请检查执行 Worker。

      - alert: StablecoinGatewayPayoutConfirmingTooLong
        expr: stablecoin_gateway_business_payouts{status="confirming"} > 0 and (time() - stablecoin_gateway_business_payout_oldest_created_timestamp_seconds{status="confirming"}) > 900
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 出款确认时间过长
          description: 最早一笔 confirming 出款创建已超过 15 分钟，请检查节点与链上交易。

      - alert: StablecoinGatewayScreeningWorkerFailures
        expr: stablecoin_gateway_worker_consecutive_failures{worker="payout-screening"} >= 3
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 出款地址筛查连续失败
          description: Screening Worker 已连续至少 3 次无法完成地址筛查。

      - alert: StablecoinGatewayScreeningBacklog
        expr: stablecoin_gateway_business_payout_screening_jobs > 0 and (time() - stablecoin_gateway_business_payout_screening_oldest_created_timestamp_seconds) > 300
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 出款地址筛查任务积压
          description: 状态 {{ $labels.status }} 的最早筛查任务创建已超过 5 分钟。

      - alert: StablecoinGatewayScreeningDenied
        expr: stablecoin_gateway_business_payout_screening_decisions{decision="deny"} > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 存在被拒绝的出款地址筛查结果
          description: 当前有 {{ $value }} 笔 deny 出款等待人工拒绝和复核。

      - alert: StablecoinGatewayScreeningReviewRequired
        expr: stablecoin_gateway_business_payout_screening_decisions{decision="review"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 出款地址需要人工复核
          description: 当前有 {{ $value }} 笔 review 出款等待人工处置。

      - alert: StablecoinGatewayDepositScreeningWorkerFailures
        expr: stablecoin_gateway_worker_consecutive_failures{worker="deposit-screening"} >= 3
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 入金地址筛查连续失败
          description: Deposit Screening Worker 已连续至少 3 次无法完成来源地址筛查，新入金会保持未入账。

      - alert: StablecoinGatewayDepositScreeningBacklog
        expr: stablecoin_gateway_business_deposit_screening_jobs > 0 and (time() - stablecoin_gateway_business_deposit_screening_oldest_created_timestamp_seconds) > 300
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 入金地址筛查任务积压
          description: 状态 {{ $labels.status }} 的最早入金筛查任务创建已超过 5 分钟。

      - alert: StablecoinGatewayDepositScreeningDenied
        expr: stablecoin_gateway_business_deposit_screening_decisions{decision="deny"} > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 存在被拒绝的入金来源地址
          description: 当前有 {{ $value }} 笔 deny 入金尚未被匹配器隔离。

      - alert: StablecoinGatewayDepositScreeningReviewRequired
        expr: stablecoin_gateway_business_deposit_screening_decisions{decision="review"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 入金来源地址需要人工复核
          description: 当前有 {{ $value }} 笔 review 入金尚未被匹配器隔离。

      - alert: StablecoinGatewaySweepPlannerFailures
        expr: stablecoin_gateway_worker_consecutive_failures{worker="sweep-planner"} >= 3
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 归集规划连续失败
          description: Sweep Planner 已连续至少 3 次无法完成安全归集规划，请检查快照、热钱包配置和数据库状态。

      - alert: StablecoinGatewaySweepScreeningWorkerFailures
        expr: stablecoin_gateway_worker_consecutive_failures{worker="sweep-screening"} >= 3
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 归集前地址筛查连续失败
          description: Sweep Screening Worker 已连续至少 3 次无法完成当前风险筛查，新的归集计划会保持阻断。

      - alert: StablecoinGatewaySweepScreeningBacklog
        expr: stablecoin_gateway_business_sweep_screening_jobs{state=~"pending|processing"} > 0 and (time() - stablecoin_gateway_business_sweep_screening_oldest_state_timestamp_seconds{state=~"pending|processing"}) > 300
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 归集前地址筛查任务积压
          description: 状态 {{ $labels.state }} 的最早归集筛查任务已等待超过 5 分钟。

      - alert: StablecoinGatewaySweepScreeningLeaseExpired
        expr: stablecoin_gateway_business_sweep_screening_jobs{state="lease_expired"} > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 归集筛查 Worker 租约失效
          description: 当前有 {{ $value }} 个归集筛查任务租约已失效且尚未被其他 Worker 接管。

      - alert: StablecoinGatewaySweepScreeningResultExpired
        expr: stablecoin_gateway_business_sweep_screening_jobs{state="result_expired"} > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 归集筛查结果已过期
          description: 当前有 {{ $value }} 个归集筛查结果已过期且尚未完成重新筛查。

      - alert: StablecoinGatewaySweepScreeningDenied
        expr: stablecoin_gateway_business_sweep_screening_decisions{decision="deny"} > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 归集来源地址被风险筛查拒绝
          description: 当前有 {{ $value }} 个归集候选因 deny 决策被阻断，需要合规人员处置。

      - alert: StablecoinGatewaySweepScreeningReviewRequired
        expr: stablecoin_gateway_business_sweep_screening_decisions{decision="review"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 归集来源地址需要人工复核
          description: 当前有 {{ $value }} 个归集候选因 review 决策被阻断。

      - alert: StablecoinGatewaySweepSigningFailures
        expr: stablecoin_gateway_worker_consecutive_failures{worker="sweep-signing"} >= 3
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 归集签名连续失败
          description: Sweep Signing Worker 已连续至少 3 次无法完成余额预检或隔离签名，请检查来源余额、节点和 signer。

      - alert: StablecoinGatewaySweepExecutionFailures
        expr: stablecoin_gateway_worker_consecutive_failures{worker="sweep-execution"} >= 3
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 归集执行连续失败
          description: Sweep Execution Worker 已连续至少 3 次无法完成广播或固化确认，请检查节点和数据库状态。

      - alert: StablecoinGatewaySweepAwaitingBroadcastTooLong
        expr: stablecoin_gateway_business_sweep_executions{status="ready_for_broadcast"} > 0 and (time() - stablecoin_gateway_business_sweep_execution_oldest_state_timestamp_seconds{status="ready_for_broadcast"}) > 300
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 已签名归集等待广播时间过长
          description: 最早一笔 ready_for_broadcast 归集创建已超过 5 分钟，请检查 Sweep Execution Worker。

      - alert: StablecoinGatewaySweepConfirmingTooLong
        expr: stablecoin_gateway_business_sweep_executions{status="confirming"} > 0 and (time() - stablecoin_gateway_business_sweep_execution_oldest_state_timestamp_seconds{status="confirming"}) > 900
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 归集确认时间过长
          description: 最早一笔 confirming 归集创建已超过 15 分钟，请检查节点与链上交易。

      - alert: StablecoinGatewayTRONNodePoolExhausted
        expr: sum by (job, instance, operation) (increase(stablecoin_gateway_tron_node_pool_exhausted_total[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: TRON 节点池全部不可用
          description: 最近 5 分钟内 {{ $labels.operation }} 操作至少一次耗尽全部已配置节点。

      - alert: StablecoinGatewayTRONNodeUsingBackup
        expr: stablecoin_gateway_tron_node_preferred{endpoint!="1"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: TRON 节点持续使用备用端点
          description: 操作 {{ $labels.operation }} 已连续 5 分钟优先使用第 {{ $labels.endpoint }} 个节点端点。

      - alert: StablecoinGatewayTRONNodeFrequentFailover
        expr: sum by (job, instance, operation) (increase(stablecoin_gateway_tron_node_switches_total[15m])) >= 3
        labels:
          severity: warning
        annotations:
          summary: TRON 节点频繁切换
          description: 操作 {{ $labels.operation }} 在 15 分钟内累计切换节点至少 3 次。

      - alert: StablecoinGatewayIndexerCursorStale
        expr: (time() - stablecoin_gateway_business_indexer_cursor_updated_timestamp_seconds) > 120
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 链索引游标停止更新
          description: 网络 {{ $labels.network }} 的索引游标已超过 2 分钟没有活动。

      - alert: StablecoinGatewayReconciliationStale
        expr: stablecoin_gateway_business_reconciliation_last_run_timestamp_seconds == 0 or (time() - stablecoin_gateway_business_reconciliation_last_run_timestamp_seconds) > 90000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 对账任务未按日执行
          description: 对账类型 {{ $labels.kind }} 从未运行或最近一次运行已超过 25 小时。

      - alert: StablecoinGatewayWalletSnapshotStale
        expr: stablecoin_gateway_business_wallet_snapshot_last_capture_timestamp_seconds == 0 or (time() - stablecoin_gateway_business_wallet_snapshot_last_capture_timestamp_seconds) > 7200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 托管钱包余额快照过期
          description: 资产 {{ $labels.asset_id }} 从未生成钱包快照或最近快照已超过 2 小时。
